{% if user.is_authenticated %}
  <form action="{% url 'blog:comment-create' post.pk %}" method="post">
    {% csrf_token %}
    <label>Add new comment
      <textarea name="content" class="form-control"></textarea>
    </label>
    <br>
    <button type="submit" class="btn btn-primary mt-2">
        Add comment
    </button>
</form>
{% endif %}
